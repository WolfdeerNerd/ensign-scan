name: Tests

# Runs the test suite on every PR and every push to main, and is also
# called by publish.yml so a release can't publish unless it passes.
#
# It also runs once a week by itself ("schedule" below). Nothing in this
# repository has to change for Ensign to break: a new ClamAV, Python,
# SQLAlchemy or distribution release can do it, and the distro jobs pull
# the newest images every time. The weekly run finds that within days,
# not at the next pull request.
#
# Six kinds of job, all required by the "Tests passed" check:
#   lint    ruff over the whole repository, and no home-directory paths
#           with a real account name in any tracked file
#   test    the suite on every supported Python, on the Ubuntu runner
#   distro  the suite inside other distributions, on their own Python and
#           libraries, with live checks of that distro's package manager
#   live    the installed package (built wheel, clean venv) against a real
#           clamd, as a regular user and under sudo
#   deps    on pull requests: blocks any change that adds a dependency or
#           action version with a known vulnerability
#   passed  one stable check name for the branch ruleset to require
on:
  push:
    branches: [main]   # PR branches are covered by pull_request; no double runs
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC; off the hour, when GitHub is less busy

# Least privilege: the tests only need to read the repo.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Pinned, so a new ruff release can't fail a pull request that didn't
      # touch the code. The rules are in pyproject.toml ([tool.ruff.lint]).
      - name: ruff
        run: |
          python -m pip install ruff==0.16.9
          ruff check --output-format github .
      # The repository is public: a path like /home/NAME published in a
      # file gives away an account name. See the script for what counts.
      - name: No home-directory paths with a real name
        run: python3 .github/scripts/check_personal_info.py --files

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # finish every version, so a failure shows which ones break
      matrix:
        python: ["3.11", "3.12", "3.13"]   # 3.11 is Ensign's minimum (tomllib)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # tests never push; don't leave a token on disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      # The optional YARA engine, so bigrules_test.py checks the sweep's
      # YARA pass (it skips itself without it).
      - run: python -m pip install yara-x==1.23.0
      # Every tests/*_test.py, so a new test file is picked up
      # without editing this workflow. No real clamd is needed: the tests
      # use an in-process fake, and the live checks skip themselves unless
      # their environment variables are set (the live and distro jobs set
      # them). The runner is not root, which fdpass_test.py needs (it
      # checks that Ensign refuses a root clamd).
      - name: Run the test suite
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*_test.py)
          (( ${#tests[@]} )) || { echo "::error::no tests/*_test.py files found"; exit 1; }
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

  # The same suite inside other distributions. Each uses its own Python
  # and, where its packages are new enough, its own libraries -- the same
  # things a user on that distro runs. Containers run as root, so the
  # suite runs as a regular user created in the container.
  distro:
    name: distro (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:latest
            # -Syu, never -Sy alone: installing after a refresh without
            # upgrading is a partial upgrade, which Arch doesn't support.
            setup: pacman -Syu --noconfirm python python-sqlalchemy python-rich
            python: python3
            # Change one packaged file whose path contains a space, so the
            # live check proves real pacman output for such a path parses.
            # cmake's docs have several; installed only if nothing in the
            # image already does.
            plant: >-
              f=$(pacman -Qlq | grep ' ' | grep -v '/$' | head -n 1);
              if [ -z "$f" ]; then
              pacman -S --noconfirm --needed cmake &&
              f=$(pacman -Qlq cmake | grep ' ' | grep -v '/$' | head -n 1);
              fi;
              test -n "$f" && printf x >> "$f" && printf '%s\n' "$f" > /tmp/ensign-planted-space
            live_env: ENSIGN_TEST_PACMAN=1 ENSIGN_EXPECT_BACKEND=pacman
          - name: Debian 12
            image: debian:12
            # Debian 12 ships Python 3.11 (Ensign's minimum) but SQLAlchemy
            # 1.4, older than the 2.0 Ensign needs, so its libraries come
            # from PyPI in a virtual environment, as a pip/pipx user's would.
            setup: >-
              apt-get update -q &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -q python3 python3-venv &&
              python3 -m venv /opt/venv &&
              /opt/venv/bin/pip install -q -r requirements.txt
            python: /opt/venv/bin/python
            # Plant one of each finding, so the live check parses real
            # dpkg output for every case, not just a clean system:
            # an edited conffile, a changed file, a missing file, and a
            # missing file that a path-exclude setting covers.
            plant: >-
              echo '# ensign CI' >> /etc/bash.bashrc &&
              printf x >> /usr/share/doc/sed/copyright &&
              rm -f /usr/share/doc/bash/copyright /usr/share/doc/grep/copyright &&
              echo 'path-exclude=/usr/share/doc/grep/*' > /etc/dpkg/dpkg.cfg.d/zz-ensign-ci
            live_env: ENSIGN_EXPECT_BACKEND=dpkg ENSIGN_EXPECT_VERIFY_FINDINGS=1
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y -q python3 python3-sqlalchemy python3-rich shadow-utils util-linux
            python: python3
            # An edited %config file and a changed binary's mode, so the
            # live check always has real rpm findings to parse.
            plant: echo '# ensign CI' >> /etc/bashrc && chmod 775 /usr/bin/true
            live_env: ENSIGN_EXPECT_BACKEND=rpm ENSIGN_EXPECT_VERIFY_FINDINGS=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python and dependencies
        run: ${{ matrix.setup }}
      - name: Plant package-file changes for the live verify check
        run: ${{ matrix.plant }}
      - name: Run the test suite as a regular user
        shell: bash
        env:
          PY: ${{ matrix.python }}
          LIVE_ENV: ${{ matrix.live_env }}
        run: |
          set -euo pipefail
          useradd -m tester
          chown -R tester .
          shopt -s nullglob
          tests=(tests/*_test.py)
          (( ${#tests[@]} )) || { echo "::error::no tests/*_test.py files found"; exit 1; }
          for t in "${tests[@]}"; do
            echo "::group::$t"
            # LIVE_ENV is unquoted on purpose: empty, or VAR=value words for env
            runuser -u tester -- env $LIVE_ENV "$PY" "$t"
            echo "::endgroup::"
          done

  # What users actually install, against a real clamd. The wheel is built
  # from this commit and installed into a clean venv; cli_live_test.py
  # drives that installed `ensign-scan` command, never the checkout.
  live:
    name: live (installed package + real clamd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENSIGN_CLI: /tmp/ensign-venv/bin/ensign-scan
      ENSIGN_TEST_CLAMD_SOCKET: /run/clamav/clamd.ctl
      # A full Ubuntu install (unlike the trimmed container images), for
      # real-world ownership lookups (usrmerge paths, multiarch names).
      ENSIGN_EXPECT_BACKEND: dpkg
      # GitHub's runner image has thousands of packages: a full
      # dpkg --verify takes longer than Ensign's 10-minute limit. The
      # Debian job runs the full verify instead.
      ENSIGN_SKIP_FULL_VERIFY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel and install it into a clean venv
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv /tmp/ensign-venv
          /tmp/ensign-venv/bin/pip install dist/*.whl
      - name: Start a clamd that knows only the EICAR test signature
        run: sudo --preserve-env=CI .github/scripts/start-test-clamd.sh
      # The whole suite again, now with the live checks on: fdpass_test.py
      # scans EICAR through a real clamd, cli_live_test.py runs the
      # installed command end to end.
      - name: Run the test suite as a regular user
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          # With real clamscan here, bigrules_test.py also checks the YARA
          # translation against clamscan's own verdicts.
          python -m pip install yara-x==1.23.0
          for t in tests/*_test.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
      # Under sudo: "~" must still mean the runner user's home, and a root
      # run must still hand clamd open files rather than run clamd as root.
      - name: Run the installed command under sudo
        run: sudo --preserve-env=ENSIGN_CLI,ENSIGN_TEST_CLAMD_SOCKET "$(command -v python)" tests/cli_live_test.py
      # clamscan as the clamav user, on files that user can't read (mode 600):
      # they must come back scanned, through stdin, never "Access denied".
      - name: Scan files the clamav user can't read, under sudo
        run: sudo "$(command -v python)" tests/clamscan_sudo_test.py
      # As root, Ensign must never read a config or write into a folder
      # another user can change (symlink and config-tampering attacks).
      - name: Root keeps its own config and data, under sudo
        run: sudo "$(command -v python)" tests/sudo_state_test.py
      # Protected mode: --protect and --unprotect, and the protected user's
      # runs failing closed. Works in a folder of its own, not /etc or /var/lib.
      - name: Protected mode, under sudo
        run: sudo "$(command -v python)" tests/protect_test.py
      # --uninstall with sudo: root's folders go too, and the user's files are
      # deleted as the user, never as root. Temporary folders only.
      - name: Uninstall, under sudo
        run: sudo "$(command -v python)" tests/uninstall_test.py
      - name: Show the clamd log and any AppArmor denials
        if: failure()
        run: |
          sudo cat /var/log/clamav/ensign-test.log || true
          sudo dmesg | grep -i 'apparmor.*clamd' | tail -20 || true

  # Compares the dependencies (requirements.txt, pyproject.toml, and the
  # actions used in workflows) before and after a pull request, and fails
  # if the change brings in a version with a published vulnerability of
  # any severity. Only pull requests have a "before and after", so on
  # pushes and releases this job is skipped -- by then every change has
  # already passed it to reach main.
  deps:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  # One stable check name for the branch ruleset to require. Requiring the
  # jobs directly would break whenever a job or matrix entry changes.
  passed:
    name: Tests passed
    if: always()
    needs: [lint, test, distro, live, deps]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.distro.result }}" = "success"
          test "${{ needs.live.result }}" = "success"
          # deps only runs on pull requests; anywhere else, skipped is expected
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ needs.deps.result }}" = "success"
          else
            test "${{ needs.deps.result }}" = "skipped"
          fi
