name: Publish to PyPI

on:
  release:
    types: [published]

# Least privilege for every job's GITHUB_TOKEN: read the repo, nothing else.
# A job with its own `permissions:` block gets ONLY what that block lists
# (it replaces this, it doesn't add to it) -- see the publish job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: lets PyPI verify this run. No checkout here, so no contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
