name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual fallback if a release event is missed. Pick the release TAG
  # (e.g. v0.3.1) as the ref, not a branch: the pypi environment only
  # deploys from v* tags, so a branch run stops before publishing.
  workflow_dispatch:

# Least privilege for every job's GITHUB_TOKEN: read the repo, nothing else.
# A job with its own `permissions:` block gets ONLY what that block lists
# (it replaces this, it doesn't add to it) -- see the publish job below.
permissions:
  contents: read

jobs:
  # The full test suite, on every supported Python, before anything is built.
  # If it fails, build never starts and nothing reaches PyPI.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: lets PyPI verify this run. No checkout here, so no contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
