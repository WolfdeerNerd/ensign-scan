name: Publish to PyPI

on:
  release:
    types: [published]
  # Two uses:
  #  * Release fallback: if a release event is missed, run this with the
  #    release TAG (e.g. v0.4.0) as the ref.
  #  * Dry run: run it with `main` as the ref to rehearse a release --
  #    tests, build, and verify-dist all run for real, then the publish job
  #    is refused, because the pypi environment only deploys from v* tags.
  #    Nothing reaches PyPI. (A failed publish job is the expected result.)
  workflow_dispatch:

# Least privilege for every job's GITHUB_TOKEN: read the repo, nothing else.
# A job with its own `permissions:` block gets ONLY what that block lists
# (it replaces this, it doesn't add to it) -- see the publish job below.
permissions:
  contents: read

jobs:
  # The full test suite, on every supported Python, before anything is built.
  # If it fails, build never starts and nothing reaches PyPI.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Test the exact files that will be uploaded, before they're uploaded.
  # The test job above checked this commit's source; this checks that the
  # built wheel and sdist install cleanly and work, and that their version
  # matches the release tag (PyPI would reject a reused version anyway,
  # but only after the approval, and with a less obvious error).
  verify-dist:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for tests/cli_live_test.py and pyproject.toml; the package under
      # test comes from the downloaded dist files, not this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel and the sdist, each into a clean venv
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl) sdists=(dist/*.tar.gz)
          (( ${#wheels[@]} == 1 && ${#sdists[@]} == 1 )) || {
            echo "::error::expected one wheel and one sdist, got: $(ls dist)"; exit 1; }
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "${wheels[0]}"
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install "${sdists[0]}"
      - name: The installed packages work and match the tag
        shell: bash
        run: |
          set -euo pipefail
          # On a release tag, the built version must equal the tag. On a
          # dry run from a branch there's no tag, so it's checked against
          # pyproject.toml instead (cli_live_test.py's default).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export ENSIGN_EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          for venv in /tmp/wheel-venv /tmp/sdist-venv; do
            echo "::group::$venv"
            ENSIGN_CLI="$venv/bin/ensign-scan" python tests/cli_live_test.py
            echo "::endgroup::"
          done

  publish:
    needs: [build, verify-dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing: lets PyPI verify this run. No checkout here, so no contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
