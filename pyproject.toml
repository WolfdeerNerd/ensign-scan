[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ensign-scan"
version = "0.10.0"
description = "Local-first ClamAV file scanner for Linux: hashes files, tracks changes in a local database, and scans only what changed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WolfdeerNerd" }]
dependencies = [
    "sqlalchemy>=2.0",
    "rich",
    # The sweep's YARA pass for files too large for ClamAV (see README, Large
    # files). Tested from 1.23; a new major version is checked before allowing it.
    "yara-x>=1.23,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]


[project.optional-dependencies]
# yara-x is a default dependency since 0.10.0. The extra is kept, empty, so
# `pipx install 'ensign-scan[yara]'` from older instructions still works.
yara = []

[project.urls]
Homepage = "https://github.com/WolfdeerNerd/ensign-scan"
Source = "https://github.com/WolfdeerNerd/ensign-scan"
Changelog = "https://github.com/WolfdeerNerd/ensign-scan/blob/main/CHANGELOG.md"

[project.scripts]
ensign-scan = "ensign_scan.cli:main"

[tool.setuptools]
packages = ["ensign_scan", "ensign_scan.pkgdb"]

# Lint rules, checked in CI (the "lint" job) and by running `ruff check .`
# F: unused or undefined names; E9: syntax errors; B: likely bugs.
[tool.ruff.lint]
select = ["F", "E9", "B"]
